<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="50%" stop-color="#0099cc"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0099cc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Wave pattern - bottom layer -->
  <path d="M0,240 Q150,180 300,220 T600,190 T900,230 T1200,200 L1200,300 L0,300 Z" fill="url(#waveGrad)"/>

  <!-- Wave pattern - middle layer -->
  <path d="M0,260 Q120,200 240,240 T480,210 T720,250 T960,220 T1200,250 L1200,300 L0,300 Z" fill="url(#waveGrad)" opacity="0.6"/>

  <!-- Wave pattern - top layer -->
  <path d="M0,280 Q100,230 200,270 T400,240 T600,280 T800,250 T1000,280 T1200,260 L1200,300 L0,300 Z" fill="url(#waveGrad)" opacity="0.4"/>

  <!-- Main text: dev1ls -->
  <text x="600" y="135" font-family="'JetBrains Mono', 'Fira Code', 'Monospace'" font-size="72" font-weight="700" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="2">dev1ls</text>

  <!-- Subtitle -->
  <text x="600" y="185" font-family="'JetBrains Mono', 'Fira Code', 'Monospace'" font-size="22" font-weight="400" fill="#ffffff" text-anchor="middle" opacity="0.95" letter-spacing="0.5">Unix Enthusiast  |  Backend &amp; Systems  |  OpenBSD/Linux/NixOS</text>

  <!-- Terminal prompt decoration -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Monospace'" font-size="14" fill="#00d4aa" opacity="0.6">
    <text x="150" y="260" text-anchor="start">$ whoami</text>
    <text x="150" y="280" text-anchor="start">&gt; dev1ls</text>
    <text x="1050" y="260" text-anchor="end">$ uname -s</text>
    <text x="1050" y="280" text-anchor="end">&gt; OpenBSD</text>
  </g>

  <!-- Bottom accent line -->
  <line x1="300" y1="295" x2="900" y2="295" stroke="#00d4aa" stroke-width="2" opacity="0.5"/>
</svg>