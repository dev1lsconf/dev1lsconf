<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.04"/>
    </pattern>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.14" result="glowColor">
        <animate attributeName="flood-opacity" values="0.10;0.22;0.10" dur="6s" repeatCount="indefinite"/>
      </feFlood>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Top and bottom hairlines -->
  <line x1="80" y1="1" x2="1120" y2="1" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <line x1="80" y1="299" x2="1120" y2="299" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>

  <!-- Flowing hairlines -->
  <g fill="none" stroke="#ffffff">
    <path d="M0,236 Q150,218 300,236 T600,236 T900,236 T1200,236 T1500,236 T1800,236 T2100,236 T2400,236" stroke-width="1" opacity="0.22">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="22s" repeatCount="indefinite"/>
    </path>
    <path d="M0,252 Q150,240 300,252 T600,252 T900,252 T1200,252 T1500,252 T1800,252 T2100,252 T2400,252" stroke-width="1" opacity="0.14">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="30s" repeatCount="indefinite"/>
    </path>
    <path d="M0,266 Q150,259 300,266 T600,266 T900,266 T1200,266 T1500,266 T1800,266 T2100,266 T2400,266" stroke-width="1" opacity="0.08">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="38s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Name -->
  <text x="600" y="148" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="700" fill="url(#textGrad)" text-anchor="middle" filter="url(#softGlow)" letter-spacing="1">dev1ls</text>

  <!-- Subtitle -->
  <text x="600" y="194" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#9ca3af" text-anchor="middle" letter-spacing="8">BACKEND · SYSTEMS · UNIX</text>

  <!-- Terminal line with blinking cursor -->
  <text x="600" y="224" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#6b7280" text-anchor="middle" letter-spacing="1">~ $ whoami<tspan fill="#9ca3af"> ▊</tspan>
    <animate attributeName="opacity" values="1;1;1;0.4;1" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
