name: Update Blog Posts in README

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:     # Manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and parse blog posts
        id: fetch
        run: |
          BLOG_URL="http://dev1ls.sdf.org/blog/"
          CONTENT=$(curl -sL "$BLOG_URL" || echo "ERROR")
          
          if [ "$CONTENT" = "ERROR" ] || [ -z "$CONTENT" ]; then
            echo "Failed to fetch blog content"
            exit 1
          fi
          
          # Use Python to extract posts and output as JSON for the next step
          python3 << 'PYEOF'
import re
import json
import sys

content = sys.stdin.read()

# Pattern for blog posts: <h2><a href="#slug">Title</a></h2>
posts = re.findall(r'<h2><a href="#([^"]+)">([^<]+)</a></h2>', content)

# Also try to find dates near the posts
date_pattern = r'(\d{1,2}\s+\w{3}\s+\d{4})'
dates = re.findall(date_pattern, content, re.IGNORECASE)

output = []
for i, (slug, title) in enumerate(posts[:5]):
    date = dates[i] if i < len(dates) else ""
    output.append({"date": date, "slug": slug, "title": title})

# Write to GITHUB_OUTPUT
with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
    f.write(f'posts_json={json.dumps(output)}')
PYEOF
        env:
          CONTENT: ${{ steps.fetch.outputs.CONTENT }}
        shell: bash

      - name: Update README with latest posts
        if: fromJson(steps.fetch.outputs.posts_json) != '[]'
        run: |
          python3 << 'PYEOF'
import re
import os
import json

with open('README.md', 'r') as f:
    content = f.read()

posts_json = os.environ.get('POSTS_JSON', '[]')
posts = json.loads(posts_json)

if not posts:
    print("No posts found")
    exit(0)

new_rows = []
for post in posts:
    date = post.get('date', '').strip()
    slug = post.get('slug', '').strip()
    title = post.get('title', '').strip()
    
    if date:
        try:
            from datetime import datetime
            dt = datetime.strptime(date, '%d %b %Y')
            formatted = dt.strftime('%d %b %Y')
        except:
            formatted = date
    else:
        formatted = ""
    
    # Extract topic from title
    topics = re.findall(r'(Gemini|cwm|Doas|CWM|TUI|CLI|OpenBSD|dotfiles|hardening|window manager)', title, re.IGNORECASE)
    topic = topics[0].lower() if topics else ""
    
    new_rows.append(f"| {formatted} | [{title}](http://dev1ls.sdf.org/blog/#{slug}) | {topic} |")

new_table = "\n".join(new_rows)

# Replace the table in the README
pattern = r'(## 📝 Últimos 5 artículos del blog\n\n\| Fecha \| Título \| Tema \|\n\|[-| ]+\|\n)(.*?)(\n## )'
replacement = r'\1' + new_table + r'\3'
new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

if new_content != content:
    with open('README.md', 'w') as f:
        f.write(new_content)
    print("README updated")
else:
    print("No changes needed")
PYEOF
        env:
          POSTS_JSON: ${{ steps.fetch.outputs.posts_json }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "🤖 Auto-update: latest 5 blog posts [skip ci]"
            git push
            echo "Pushed updates"
          else
            echo "No changes to commit"
          fi