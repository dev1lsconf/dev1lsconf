name: Sync Blog Posts to README

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch blog HTML
        id: fetch
        run: |
          curl -sL "http://dev1ls.sdf.org/blog/" -o /tmp/blog.html || exit 1
          cat > /tmp/parse.py << 'PYEOF'
import re, json, sys, os
with open('/tmp/blog.html') as f:
    content = f.read()
posts = re.findall(r'<h2><a href="#([^"]+)">([^<]+)</a></h2>', content)
dates = re.findall(r'(\d{1,2}\s+\w{3}\s+\d{4})', content, re.IGNORECASE)
out = []
for i, (slug, title) in enumerate(posts[:5]):
    out.append({'date': dates[i] if i < len(dates) else '', 'slug': slug, 'title': title})
with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
    f.write('posts_json=' + json.dumps(out))
PYEOF
          python3 /tmp/parse.py

      - name: Update README
        if: fromJson(steps.fetch.outputs.posts_json) != '[]'
        env:
          POSTS_JSON: ${{ steps.fetch.outputs.posts_json }}
        run: |
          cat > /tmp/update.py << 'PYEOF'
import re, json, os, sys
with open('README.md') as f:
    content = f.read()
posts = json.loads(os.environ.get('POSTS_JSON', '[]'))
if not posts:
    sys.exit(0)
rows = []
for p in posts:
    d = p.get('date','').strip()
    s = p.get('slug','').strip()
    t = p.get('title','').strip()
    try:
        from datetime import datetime
        f = datetime.strptime(d, '%d %b %Y').strftime('%d %b %Y') if d else ''
    except:
        f = d
    topic = re.findall(r'(Gemini|cwm|Doas|CWM|TUI|CLI|OpenBSD|dotfiles|hardening|window manager)', t, re.I)
    rows.append(f'| {f} | [{t}](http://dev1ls.sdf.org/blog/#{s}) | {topic[0].lower() if topic else ""} |')
table = '\n'.join(rows)
new = re.sub(r'(## 📝 Últimos 5 artículos del blog\n\n\| Fecha \| Título \| Tema \|\n\|[-| ]+\|\n)(.*?)(\n## )', r'\1' + table + r'\3', content, flags=re.DOTALL)
if new != content:
    with open('README.md', 'w') as f:
        f.write(new)
    print('README updated')
else:
    print('No changes')
PYEOF
          python3 /tmp/update.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "🤖 Auto-update: latest 5 blog posts [skip ci]"
            git push
            echo "Pushed"
          else
            echo "No changes"
          fi
