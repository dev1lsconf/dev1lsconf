<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="160" fill="url(#bgGrad)"/>
  <rect width="1200" height="160" fill="url(#grid)"/>

  <line x1="80" y1="1" x2="1120" y2="1" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <line x1="80" y1="159" x2="1120" y2="159" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>

  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <line x1="300" y1="48" x2="300" y2="120"/>
    <line x1="600" y1="48" x2="600" y2="120"/>
    <line x1="900" y1="48" x2="900" y2="120"/>
  </g>

  <text x="150" y="88" text-anchor="middle" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" fill="#ffffff">13</text>
  <text x="150" y="120" text-anchor="middle" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#9ca3af">FOLLOWERS</text>

  <text x="450" y="88" text-anchor="middle" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" fill="#ffffff">18</text>
  <text x="450" y="120" text-anchor="middle" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#9ca3af">REPOSITORIES</text>

  <text x="750" y="88" text-anchor="middle" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" fill="#ffffff">14</text>
  <text x="750" y="120" text-anchor="middle" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#9ca3af">STARS</text>

  <text x="1050" y="88" text-anchor="middle" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" fill="#ffffff">2014</text>
  <text x="1050" y="120" text-anchor="middle" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#9ca3af">ON GITHUB</text>
