<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="100" fill="url(#bgGrad)"/>
  <rect width="1200" height="100" fill="url(#grid)"/>

  <line x1="80" y1="1" x2="1120" y2="1" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>

  <g fill="none" stroke="#ffffff">
    <path d="M0,58 Q150,46 300,58 T600,58 T900,58 T1200,58 T1500,58 T1800,58 T2100,58 T2400,58" stroke-width="1" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="26s" repeatCount="indefinite"/>
    </path>
    <path d="M0,70 Q150,64 300,70 T600,70 T900,70 T1200,70 T1500,70 T1800,70 T2100,70 T2400,70" stroke-width="1" opacity="0.10">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="34s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="600" y="40" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">KEEP IT SIMPLE, KEEP IT SECURE, KEEP IT UNIX</text>
</svg>
