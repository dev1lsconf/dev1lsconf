<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="50%" stop-color="#0099cc"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0099cc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="100" fill="url(#bgGrad)"/>

  <!-- Wave pattern -->
  <path d="M0,60 Q150,20 300,50 T600,30 T900,60 T1200,40 L1200,100 L0,100 Z" fill="url(#waveGrad)"/>
  <path d="M0,80 Q100,40 200,70 T400,50 T600,80 T800,55 T1000,75 T1200,65 L1200,100 L0,100 Z" fill="url(#waveGrad)" opacity="0.5"/>

  <!-- Subtle text hint -->
  <text x="600" y="65" font-family="'JetBrains Mono', 'Fira Code', 'Monospace'" font-size="14" font-weight="400" fill="#ffffff" text-anchor="middle" opacity="0.7">keep it simple, keep it secure, keep it Unix</text>
</svg>