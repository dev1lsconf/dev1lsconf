<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100">
  <defs>
    <!-- Dark professional background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="50%" stop-color="#0d1423"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>

    <!-- Subtle accent gradient for waves -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0099cc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Text fill gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#a0d8f0"/>
    </linearGradient>

    <!-- Glowing stroke filter for text -->
    <filter id="glowStroke" x="-80%" y="-80%" width="260%" height="260%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="stroke"/>
      <feGaussianBlur in="stroke" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00d4aa" flood-opacity="0.8" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Decorative grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4aa" stroke-width="0.3" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="100" fill="url(#bgGrad)"/>

  <!-- Subtle grid overlay -->
  <rect width="1200" height="100" fill="url(#grid)"/>

  <!-- Wave pattern -->
  <path d="M0,60 Q150,20 300,50 T600,30 T900,60 T1200,40 L1200,100 L0,100 Z" fill="url(#waveGrad)"/>
  <path d="M0,80 Q100,40 200,70 T400,50 T600,80 T800,55 T1000,75 T1200,65 L1200,100 L0,100 Z" fill="url(#waveGrad)" opacity="0.5"/>

  <!-- Text with glowing stroke border -->
  <text x="600" y="62" font-family="'JetBrains Mono', 'Fira Code', 'Monospace'" font-size="14" font-weight="500" fill="url(#textGrad)" text-anchor="middle" filter="url(#glowStroke)" letter-spacing="0.5" opacity="0.9">keep it simple, keep it secure, keep it Unix</text>
</svg>